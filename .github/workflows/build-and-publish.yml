name: Build and Publish ROS Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - ros_distro: humble
            ubuntu_codename: jammy
            runner: ubuntu-22.04
          - ros_distro: jazzy
            ubuntu_codename: noble
            runner: ubuntu-24.04

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ROS ${{ matrix.ros_distro }}
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg lsb-release
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] \
            http://packages.ros.org/ros2/ubuntu ${{ matrix.ubuntu_codename }} main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update
          sudo apt-get install -y ros-${{ matrix.ros_distro }}-ros-base python3-colcon-common-extensions

      - name: Install bloom and build tools
        run: |
          sudo apt-get install -y python3-bloom python3-rosdep fakeroot debhelper dh-python
          sudo rosdep init || true
          rosdep update

      - name: Build .deb with bloom
        run: |
          source /opt/ros/${{ matrix.ros_distro }}/setup.bash
          rosdep install --from-paths . --ignore-src -r -y \
            --rosdistro ${{ matrix.ros_distro }}
          bloom-generate rosdebian \
            --os-name ubuntu \
            --os-version ${{ matrix.ubuntu_codename }} \
            --ros-distro ${{ matrix.ros_distro }}
          fakeroot debian/rules binary
          ls -la ../*.deb

      - name: Collect .deb
        run: |
          mkdir -p debs
          cp ../*.deb debs/

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.ubuntu_codename }}
          path: debs/*.deb
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Install repo tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Download all .deb artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: deb-*

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | awk '{print $2}' | cut -d/ -f2)
          echo "GPG_KEY_ID=${GPG_KEY_ID}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build multi-suite apt repository
        run: |
          set -euo pipefail

          # Un pool y un dists/<codename>/ por cada artifact descargado.
          # El artifact se llama deb-<codename>, de ahi sale la suite.
          for artifact_dir in artifacts/deb-*; do
            codename="${artifact_dir#artifacts/deb-}"
            echo "::group::Building suite ${codename}"

            pool="apt-repo/pool/${codename}/main"
            binary="apt-repo/dists/${codename}/main/binary-amd64"
            mkdir -p "${pool}" "${binary}"
            cp "${artifact_dir}"/*.deb "${pool}/"

            # dpkg-scanpackages necesita rutas relativas a la raiz del repo
            ( cd apt-repo && \
              dpkg-scanpackages "pool/${codename}/main" /dev/null \
                > "dists/${codename}/main/binary-amd64/Packages" )
            gzip -kf "${binary}/Packages"

            ( cd "apt-repo/dists/${codename}"
              cat > Release <<EOF
          Origin: Kalman Robotics
          Label: Kalman Robotics
          Suite: ${codename}
          Codename: ${codename}
          Architectures: amd64
          Components: main
          Description: Kalman Robotics ROS packages
          EOF
              apt-ftparchive release . >> Release

              gpg --batch --yes --default-key "${GPG_KEY_ID}" \
                --armor --clearsign -o InRelease Release
              gpg --batch --yes --default-key "${GPG_KEY_ID}" \
                --armor --detach-sign -o Release.gpg Release
            )
            echo "::endgroup::"
          done

          find apt-repo -type f | sort

      - name: Upload apt repository to S3
        run: |
          aws s3 sync apt-repo/ s3://${{ secrets.AWS_S3_BUCKET }}/packages/ \
            --region ${{ secrets.AWS_REGION }} \
            --delete \
            --exclude "kalman.gpg" \
            --exclude "install-kalman-interfaces.sh"

      - name: Upload public GPG key and installer
        run: |
          gpg --armor --export "${GPG_KEY_ID}" | \
            aws s3 cp - s3://${{ secrets.AWS_S3_BUCKET }}/packages/kalman.gpg \
              --region ${{ secrets.AWS_REGION }}

          echo "✅ Paquete publicado en s3://${{ secrets.AWS_S3_BUCKET }}/packages/"
