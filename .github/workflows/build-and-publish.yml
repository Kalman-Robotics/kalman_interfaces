name: Build and Publish ROS Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ROS Humble
        run: |
          sudo apt-get update
          sudo apt-get install -y curl gnupg lsb-release
          sudo curl -sSL https://raw.githubusercontent.com/ros/rosdistro/master/ros.key \
            -o /usr/share/keyrings/ros-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/ros-archive-keyring.gpg] \
            http://packages.ros.org/ros2/ubuntu $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/ros2.list
          sudo apt-get update
          sudo apt-get install -y ros-humble-ros-base python3-colcon-common-extensions

      - name: Install bloom and build tools
        run: |
          sudo apt-get install -y python3-bloom python3-rosdep fakeroot debhelper dh-python
          sudo rosdep init || true
          rosdep update

      - name: Build .deb with bloom
        run: |
          source /opt/ros/humble/setup.bash
          rosdep install --from-paths . --ignore-src -r -y
          bloom-generate rosdebian --os-name ubuntu --os-version jammy --ros-distro humble
          fakeroot debian/rules binary
          ls -la ../*.deb

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | awk '{print $2}' | cut -d/ -f2)
          echo "GPG_KEY_ID=${GPG_KEY_ID}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Build apt repository and upload to S3
        run: |
          mkdir -p apt-repo/pool/main
          mkdir -p apt-repo/dists/jammy/main/binary-amd64

          # Copiar .deb al pool
          cp ../*.deb apt-repo/pool/main/

          # Generar Packages
          cd apt-repo
          dpkg-scanpackages pool/main /dev/null > dists/jammy/main/binary-amd64/Packages
          gzip -k dists/jammy/main/binary-amd64/Packages

          # Generar Release
          cd dists/jammy
          cat > Release <<EOF
          Origin: Kalman Robotics
          Label: Kalman Robotics
          Suite: jammy
          Codename: jammy
          Architectures: amd64
          Components: main
          Description: Kalman Robotics ROS packages
          EOF
          apt-ftparchive release . >> Release

          # Firmar Release con GPG
          gpg --batch --yes --default-key "${GPG_KEY_ID}" \
            --armor --detach-sign \
            -o InRelease --clearsign Release
          gpg --batch --yes --default-key "${GPG_KEY_ID}" \
            --armor --detach-sign \
            -o Release.gpg Release

          cd ../../..

          # Subir todo a S3
          aws s3 sync apt-repo/ s3://${{ secrets.AWS_S3_BUCKET }}/packages/ \
            --region ${{ secrets.AWS_REGION }} \
            --delete

          # Subir clave GPG pública
          gpg --armor --export "${GPG_KEY_ID}" | \
            aws s3 cp - s3://${{ secrets.AWS_S3_BUCKET }}/packages/kalman.gpg \
            --region ${{ secrets.AWS_REGION }}

          echo "✅ Paquete publicado en s3://${{ secrets.AWS_S3_BUCKET }}/packages/"
